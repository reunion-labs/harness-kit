# Publish @erzhe/harness-kit to npm when a v* tag is pushed.
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN. The package's npmjs.com
# settings must list reunion-labs/harness-kit + this workflow file as a trusted publisher.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm Trusted Publishing (OIDC) + provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Check tag matches package.json version
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if npm view "@erzhe/harness-kit@$version" version >/dev/null 2>&1; then
            echo "::error::@erzhe/harness-kit@$version is already on npm"
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Smoke test bundled CLI
        run: test "$(node dist/harness-kit.cjs --version)" = "${{ steps.meta.outputs.version }}"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [ "${{ steps.meta.outputs.dist_tag }}" = "next" ] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
