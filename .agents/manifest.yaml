spec: ai-harness/v0

identity:
  name: ai-harness
  summary: AI-friendly repo harness CLI —— 把工程知识变成 agent 可消费的 manifest，生成各工具文件并用门禁保证一致
  scope_in:
    - CLI 命令 init / prepare-adoption / record-adoption-audit / sync / upgrade / doctor / verify / task / task-start / deliver / ci / accept-contract / install-hooks / onboard / plan-checks / run-checks / evidence / record-context-review / check-loop（src/）
    - manifest schema + 生成器 + 声明式不变量执行 + 派生新鲜度 + 影响面 planner
  scope_out:
    - 目标仓库自身的业务代码（本工具只读它们的 .agents/manifest.yaml）
    - spec-driven 工作流引擎（Spec Kit / Kiro 的活，可骑在我们之上）
  downstream:
    - 任何被 harness 初始化的仓库

capabilities:
  setup:     { run: "pnpm install" }
  typecheck: { run: "pnpm typecheck", desc: "tsc --noEmit" }
  test:      { run: "pnpm test", desc: "node:test + tsx 核心单测（enforce/state/render/contracts/manifest）" }
  build:     { run: "pnpm build", desc: "esbuild 打包成 dist/harness-kit.cjs 单文件可执行（bin 入口）" }
  harness:   { run: "pnpm exec tsx src/cli.ts", desc: "跑 CLI（开发态）", example: "pnpm exec tsx src/cli.ts verify --repo ." }

contracts:
  - id: cli-interface
    kind: cli-interface
    desc: 所有公开命令及各自 flags；改动即影响所有使用者
    breaking_needs: minor
    snapshot: "node scripts/cli-interface-snapshot.mjs"
  - id: manifest-schema
    kind: other
    desc: .agents/manifest.yaml 的 schema（见 SPEC-v0.md）；删字段/改语义会破坏已初始化的仓
    breaking_needs: major
    check: "node --import tsx --test test/manifest.test.ts test/examples.test.ts"

invariants:
  - id: no-raw-console-in-commands
    rule: 命令模块统一走 util 的 ok/err/warn/info，不直接 console.log
    enforcement:
      forbid_pattern: ["console\\.log\\("]
      path_glob: ["src/commands/**"]
  - id: generated-header-present
    rule: 所有生成物顶部必须带 DO-NOT-EDIT 头（由 GEN_HEADER 保证）
    manual: true

knowledge:
  - path: knowledge/domain.md
    role: domain
    binds: ["src/cli.ts", "src/manifest.ts"]
  - path: knowledge/journal/
    role: journal

routing:
  - when: 加 / 改 CLI 命令
    read: ["src/cli.ts", "src/commands"]
    entry: ["src/cli.ts"]
    dont_assume:
      - 用户可见输出走 util 的 ok/err/warn/info（ASCII，无 emoji）
    verify: ["typecheck"]
  - when: 改 manifest schema
    read: ["src/manifest.ts", "SPEC-v0.md"]
    entry: ["src/manifest.ts"]
    dont_assume:
      - schema 改动要同步 SPEC-v0.md + examples/ 五个样板，否则 doctor 漂移
      - contract id 会成为文件名，glob 会交给 matcher；两者必须在 schema 期限制并安全编译
    verify: ["typecheck"]
  - when: 改生成模板
    read: ["src/render.ts"]
    entry: ["src/render.ts"]
    dont_assume:
      - AGENTS.md 有体量预算（150 行 / 700 词），细节下沉到 .agents/
    verify: ["typecheck"]
  - when: 改生成文件安全 / 接管迁移
    read: ["src/managed-files.ts", "src/adoption.ts", "src/commands/prepare-adoption.ts", "src/commands/record-adoption-audit.ts", "src/commands/sync.ts"]
    entry: ["src/managed-files.ts"]
    dont_assume:
      - 普通文件接管必须有原样 snapshot + 仓外 candidate + 绑定报告的 pass receipt；裸 adopt 不构成授权
      - receipt 只能证明声明顺序与候选字节未漂移，不能证明审计 Agent 独立或语义判断正确
      - 仓内 legacy snapshot 只保存将被接管的 managed entry；嵌套入口和引用文档保持原位，只进入仓外 guidance bundle
      - adoption index/snapshot 父链禁 symlink、no-follow/no-replace；index 失败时保留 append-only snapshot 供恢复，不能删掉可能已并发改写的 inode
      - 只有 CLAUDE.md -> AGENTS.md 相对软链接可保留
      - sync 只生成确定性文件，不能刷新 context review
    verify: ["test", "typecheck"]
  - when: 改 Harness 版本升级规则 / 状态迁移
    read: ["src/upgrade.ts", "src/commands/upgrade.ts", "src/managed-files.ts", "src/commands/doctor.ts", "src/commands/verify.ts"]
    entry: ["src/upgrade.ts", "src/commands/upgrade.ts"]
    dont_assume:
      - upgrade 以当前运行 CLI 版本为目标，不访问 npm、CI 或代码托管平台
      - 迁移状态必须确定、可提交且不记录时间戳或 Agent 名单
      - upgrade 的仓内文件共用一次事务，已装的项目级 Hook 也在其中原位刷新；新装 / 卸载 Hook 和 linked-worktree Codex 分发器（Git admin、用户目录）仍留给 install-hooks
      - 可选产品能力不能伪装成所有仓库必跑的结构迁移
    verify: ["test", "typecheck"]
  - when: 改 CI 门禁入口（ci）/ CI 示例
    read: ["src/ci.ts", "src/commands/ci.ts", "src/commands/run-checks.ts", "src/commands/verify.ts", "examples/ci/README.md"]
    entry: ["src/commands/ci.ts"]
    dont_assume:
      - ci 的结果只在 CI job 里：不读也不写 deliver 戳、task 记录、waiver 和证据
      - 取不到 base、浅克隆加深失败都是配置 / 环境错误（exit 2），不是“没有改动”，也不能退回 HEAD~1
    verify: ["test", "typecheck"]
  - when: 改知识新鲜度 / Agent 复核
    read: ["src/state.ts", "src/commands/record-context-review.ts", "SPEC-v0.md"]
    entry: ["src/state.ts"]
    dont_assume:
      - repo-root knowledge 路径不按 docs/knowledge/context 文件夹名写死
      - record-context-review 只记录 Agent 已完成分析的证据，不替代分析
    verify: ["test", "typecheck"]
  - when: 加 / 改测试
    read: ["test", "src"]
    entry: ["test"]
    dont_assume:
      - 单测用 node:test + tsx，勿引入 jest/vitest（反仪式、少依赖）
    verify: ["test", "typecheck"]
  - when: 发版 / 改发布流程
    read: [".github/workflows/publish.yml", ".agents/knowledge/journal/2026-11-24-tag-triggered-npm-publish.md", "package.json"]
    entry: [".github/workflows/publish.yml"]
    dont_assume:
      - 合入 main 不会发包；只有推送 v<version> tag 才触发发布，且 tag 必须等于 package.json version
      - 发版是人的决定：除非用户明确要求，Agent 不推 tag、不跑 npm publish
      - npm Trusted Publisher 绑定 reunion-labs/harness-kit + publish.yml；改工作流文件名或迁仓必须先改 npm 包设置
    verify: ["test", "typecheck"]

modules:
  - name: cli
    role: 命令入口与分发（commander）
    entry: ["src/cli.ts"]
    owns: ["src/cli.ts", "scripts/cli-interface-snapshot.mjs"]
    tests: ["test/cli.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - 新命令记得用 guard() 包裹，统一错误退出码
      - 公开命令或 flag 改动要更新完整 help snapshot，不能只看顶层 --help
  - name: manifest
    role: manifest schema + 加载 + 校验
    entry: ["src/manifest.ts"]
    owns: ["src/manifest.ts", "SPEC-v0.md", ".agents/manifest.yaml", "examples/*/.agents/manifest.yaml"]
    tests: ["test/manifest.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - contract id 必须是跨平台安全的直接文件名、ASCII case-fold 后唯一且避开系统保留名；所有执行型 glob 都要限制长度并在 schema 期编译
  - name: render
    role: manifest -> 各工具文件的生成器
    entry: ["src/render.ts"]
    owns: ["src/render.ts"]
    tests: ["test/render.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    must_know:
      - routing/modules 只在声明时才生成对应 .agents/*.md
      - 入口里的可执行命令写成 .agents/harness.lock.json 钉住的 npx 调用；render 保持纯函数，版本由调用方读 lock 后传入
    pitfalls:
      - AGENTS.md 要保持精简，别把 routing/modules 全文塞进去
      - sync / verify / doctor / adoption 必须用同一个 lock 版本渲染，upgrade 用目标版本渲染，否则入口会被判为漂移
      - 固定 Working agreement 控制在 240 词内（有测试）；GEN_HEADER 不写版本也不写裸命令，改它时旧 CLAUDE.md stub 靠 isHarnessGenerated 的精确 stub 识别才能继续被刷新
      - 词数预算只算仓库内容：agentsMdLines 把固定文本标成 fixed，新增固定文案必须走 fixed.push；countWords 里汉字 / 假名每个算半个词（不能再按空白把整段中文算成 1 个词），CJK 旁的空格和纯符号 token 不计
      - 不变量渲染带 id（scope / routing / 模块卡按 id 引用）；上下游两条以上逐条一行（条目里可能有逗号、分号），只有一条时保持行内
  - name: enforce
    role: 声明式不变量执行（确定性，无 LLM）
    entry: ["src/enforce.ts"]
    owns: ["src/enforce.ts"]
    tests: ["test/enforce.test.ts"]
    checks: ["test", "typecheck"]
    pitfalls:
      - path_glob 是 include-only；想排除文件只能靠缩小 glob 范围
  - name: planner
    role: 纯函数影响面 planner（diff -> checks + gaps，无 IO）
    entry: ["src/planner.ts"]
    owns: ["src/planner.ts"]
    tests: ["test/planner.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - 保持纯函数：不碰 git / fs / 进程，只做 glob 匹配，方便单测
      - HARNESS_COVERED_GLOBS（.agents/**、生成入口、install-hooks 写的客户端配置）由 verify 判定，不算 unmapped / required-unmapped，全是这类路径的改动也不报 no-checks-selected；它们只免检、不挑选检查，模块仍可 owns 它们来加检查
      - 改动的文件被可自动执行的 capability 的 run 命令引用时（脚本或目录前缀）选中该 capability；mutating / background 不选，manifest 里没当作 check 用到的 capability（setup、开发态启动器、发布脚本）也不选
  - name: git-diff
    role: 安全收集 committed / staged / unstaged / untracked 改动并生成指纹
    entry: ["src/git.ts"]
    owns: ["src/git.ts"]
    tests: ["test/git.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - Git ref 必须用参数数组传给 git，禁止拼进 shell
      - SessionStart 基线必须用 exact diff，不能用 merge-base 吞掉会话内 commit
      - nested --repo 必须只返回 target 内且 target-relative 的路径，不能混入兄弟 package
      - fingerprint 必须覆盖 Git 可执行位，以及 submodule 当前 commit/脏状态，不能只 hash 普通文件内容
  - name: validation-runner
    role: plan-checks / run-checks / evidence 与持久化验收状态
    entry: ["src/commands/run-checks.ts"]
    owns: ["src/commands/plan-checks.ts", "src/commands/run-checks.ts", "src/commands/evidence.ts", "src/validation-state.ts", "src/validation-plan.ts", "src/validation-gates.ts"]
    tests: ["test/run-checks.test.ts", "test/validation-state.test.ts", "test/doctor.test.ts", "test/verify.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - run-checks 只执行可终止、无副作用的 capability；unknown/background/mutating 都必须 fail closed
      - waiver 只允许覆盖类 gap，且仅对同一 change fingerprint + gap kind + scope 生效，理由不能为空
      - evidence 读取时必须重算代码与 validation-plan fingerprint；代码、policy/planner 变化或旧证据缺少计划绑定都必须 stale + 非零退出
      - 手动 evidence 的整体 valid 也要求同指纹 verifyPassed，run-checks 单独通过只算 runChecksValid
      - 任务验收优先用 deliver；隐式 HEAD 的 no-change 不能证明已 commit 任务范围，应用 task start / --base
      - evidence 的 hookActive / lifecycle 默认看最近的 lifecycle 会话而不是 latest 指针；显式 --session 只看该会话
      - SessionStart 新建会话不得移动 manual latest 指针，否则会话前仍覆盖当前改动的 deliver 戳会被藏掉
      - check 进程的 HARNESS_KIT_BASE / HARNESS_KIT_CHANGED_FILES 由 run-checks 注入，外层同名变量必须先清掉
      - lifecycle.active 只要求配置未变且门禁证据当时通过（evidencePassed）；证据过期（evidenceCurrent=false）不让 hook 状态 DEGRADED
      - evidence 顶层 session/agent 描述最近记录（record.kind），hookConfigurationCurrent 跟随 hook 证明来源，不能在 lifecycle 当前时报 false；手动记录带 deliveredIn（task 记录所属的 Agent 会话），record.createdAt 是证据写入时间
  - name: delivery
    role: 任务 scope 解析、deliver 编排与 delivery stamp
    entry: ["src/delivery.ts", "src/commands/deliver.ts"]
    owns: ["src/delivery.ts", "src/commands/deliver.ts", "src/commands/task.ts"]
    tests: ["test/delivery.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - 改动范围：task/--base 优先，否则降级 worktree vs HEAD；禁止默认 merge-base origin/main
      - deliver 路径 budgetMs=0（长跑允许）；mutating/background 仍 fail closed
      - stamp 只写 Git admin 私有状态，读取时必须 freshness 重算
      - 继承的 context 过期只在本任务没碰它的输入（binds/entry、知识文档、manifest 声明、state 复核记录）时降为 maintenance；独立 verify 仍严格
      - 目录没有 manifest 时先找祖先和嵌套 target：祖先存在就要求到 target 根重跑，否则 not-adopted（exit 3），不写任何证据
      - stamp 按 target 读取（inspectDeliveryStamp / coveringStampEvidence 不能用 gitRoot），否则嵌套 target 读到外层 target 的戳
      - task 记录会跨会话留在 Git admin dir；deliver 必须报告它的来源，并在超过 7 天或 base 不是 HEAD 祖先时警告
  - name: ci-gate
    role: CI 合码门禁：从参数 / CI 环境变量确定 base，补齐算 merge-base 所需的历史，在同一 merge-base 上跑 run-checks + verify
    entry: ["src/commands/ci.ts"]
    owns: ["src/ci.ts", "src/commands/ci.ts"]
    tests: ["test/ci.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - base 优先级：--base > HARNESS_KIT_BASE > GitLab MR（DIFF_BASE_SHA；merged_result / merge_train 先用目标分支）> GITHUB_BASE_REF > push / merge queue 的推送区间；都没有就 exit 2，绝不猜 HEAD~1
      - 退出码：0 通过、1 检查或 verify 失败、2 配置 / 环境错误（含命令行用法错误和意外异常）；环境问题不能读成“检查失败”，也不能静默通过
      - 浅克隆要同时加深 base 和 HEAD 两侧：浅 HEAD 没有父提交，base 在本地也算不出 merge-base；逐步 --deepen 后再 --unshallow，仍不行报 shallow-history
      - ci 不读也不写本地 deliver 状态：run-checks 传 record:false，verify 传 recordManualEvidence:false；本地 waiver 在 CI 里不生效
      - 来自参数或环境变量的 base 只接受分支 / ref / commit 形状，拒绝以 - 开头、范围和 refspec；git 一律参数数组 + --end-of-options，fetch 设 GIT_TERMINAL_PROMPT=0
      - 单测要清掉宿主的 GITHUB_* / GITLAB_* / CI_* / HARNESS_KIT_BASE，否则在 CI 里跑测试会被宿主变量带偏
  - name: agent-hooks
    role: Claude Code / Cursor / Codex 的 SessionStart + Stop 生命周期门禁
    entry: ["src/commands/hook-event.ts"]
    owns: ["src/commands/install-hooks.ts", "src/commands/stop-hooks.ts", "src/commands/hook-event.ts", "src/hook-status.ts", "src/codex-linked-hooks.ts"]
    tests: ["test/install-hooks.test.ts", "test/hook-event.test.ts", "test/codex-linked-hooks.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - Claude/Codex 用 stdout JSON decision=block；Cursor 用 stdout JSON followup_message
      - Stop 默认 thin（查 stamp），HARNESS_KIT_STOP_MODE=execute 才内嵌重跑；禁止因缺 SessionStart 要求新会话
      - 每次 Stop 都记 lifecycle 观察，thin 放行时绑定它接受的 deliver 戳；记录不得移动 manual latest 指针，也不得改变放行或拦截结论
      - execute 模式若在 hook 内跑 verify，预算需小于客户端 hook 超时
      - Codex linked worktree 必须显式安装用户分发器 fallback；无登记 silent no-op，有登记但路径/权限/runner hash 不一致则 fail closed
      - linked worktree 只能有一条 Harness 生命周期路径；安装时移除自己的项目 Hook、保留第三方项目 Hook，状态发现双路径必须 DEGRADED
      - linked worktree 要比较 canonical git-dir 与 git-common-dir，不能把同样使用 .git 文件的 submodule 误判为 linked
      - Orca 的 CODEX_HOME 是生成态；用户分发器必须写入 ~/.codex 源配置并由新终端镜像，不能补丁运行时 hooks、Orca 管理脚本或 trust 状态
      - 原生 Git hooks 可能由 linked worktrees 共享；默认拒绝共享/custom/global/foreign hooks，不能用 --force 覆盖第三方 hook
      - Agent hook runner 与客户端配置必须整组预检、事务写入；拒绝配置软链接和未知 hooks 结构，不能写到项目外或留半套配置
      - ACTIVE 只认安装器生成的精确 runner 与逐 agent/event 命令；marker 文本或不安全 HARNESS_KIT_CMD 前缀都不构成配置证据
      - ACTIVE evidence 必须绑定 SessionStart 时的 runner/client-config 指纹；合法 override 或配置变化后旧证据也只能 DEGRADED
      - Hook 配置渲染依据的旧字节必须绑定同一次事务 preflight；并发更新要失败并保留新内容
      - 用户分发器登记必须最后写入；ACTIVE 指纹只绑定 Harness managed 用户入口，不得被无关第三方用户 Hook 变化污染
      - Hook 失败兜底文案不写裸 harness-kit；改兜底文案时把旧文案加进 LEGACY_HOOK_FAILURE_MESSAGES，否则已装配置会被当成第三方条目而重复安装
      - Stop 拦截文案写被门禁 target 的绝对 --repo，不能写 --repo .
      - runner 先读完 stdin 再转给 CLI；CLI 不可用时干净工作区放行，脏工作区每轮只拦一次（stop_hook_active / loop_count 即放行），绝不无限拦截
      - CLI 侧 loop-exit 只在 continuing 且 stop-guard 指纹与上次拦截相同时放行，记 lifecycle reason=loop-exit，永远不算门禁证据
      - 客户端配置里的外层 Stop 命令先把 stdin 读进变量再交给 runner，兜底的 stop_hook_active 守卫读这份副本（runner 读完 stdin 后崩溃也只拦一次），放行时同样提示未验证；改命令形状时把旧形状留在 isInstalledAgentHookCommand 的识别里，HARNESS_KIT_CMD override 放在 runner 调用之前
      - 会话中途刷新 hook（upgrade / install-hooks）后，Stop 只在当前 runner 就是本版本、且除 Harness 自己的条目外客户端配置与 SessionStart 时一致才 rebind；第三方改动、linked Codex 一律要新会话
  - name: managed-generation
    role: 生成文件接管、软链接边界与事务写入
    entry: ["src/managed-files.ts"]
    owns: ["src/managed-files.ts", "src/adoption.ts", "src/commands/{init,prepare-adoption,record-adoption-audit,sync}.ts"]
    tests: ["test/managed-files.test.ts", "test/adoption.test.ts", "test/cli.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - 接管授权必须在同一次 preflight 上完成，不能先 inspect 再另一次 write 留 TOCTOU 缝隙
      - audit bundle/receipt 必须在仓外且内容寻址；apply 重新渲染核对，不能把候选当任意写入源
      - init 非 force 要先统一预检全部 scaffold；legacy 文件 mode 与 guidance 的原位字节/拓扑都必须进入审计绑定
      - guidance 普通文件必须走仓库范围的 O_NOFOLLOW + inode 绑定读取；不能 lstat 后直接按路径 read 留软链接替换窗口
      - declared/unverified 不能命名成 verified；本地 hash 没有外部身份信任根
      - sync 不得写 .agents/.harness-state.json；语义新鲜度只由 record-context-review 推进
      - candidate 必须绑定 landing 落点（.agents 下手写文件、lock、复核 state + root=repo knowledge）；只排除 manifest、生成入口、adoption/、hooks/；.agents 外的接入改动进 worktree 证据，INDEX.md 也进 hash
      - 普通 sync 不创建首个 AGENTS.md：要么 --adopt-existing + pass 回执，要么 --create-entry 且仓内没有任何 agent 指引（含其他客户端规则文件）
      - sync / upgrade 只删除 manifest 已不再声明的 context 的复核记录（retired review），不新增、不刷新任何复核
      - 其他客户端的规则文件（.cursor/rules、copilot-instructions 等）是 guidance 根，只进 bundle，不做 legacy 快照；纯路径提及以非 ASCII 路径字符为边界，未解析的域名形提及丢弃
      - 引用闭包只把找不到仓内文件的纯路径提及降级为 unresolved（进 candidate hash、apply 时重比）；链接 / @import 缺失或在仓外、以及存在但不安全的目标仍 fail closed
      - 生成物判定统一走 isHarnessGenerated（生成标记开头或精确 CLAUDE.md stub），不要再各处写 startsWith(marker)
      - sync --adopt-existing 必须带 candidate+audit，只要会写入就核对回执，没有 legacy 入口也一样；只有纯 no-op 跳过
      - init 起步 manifest 按 go.mod / Cargo.toml / package.json 推断，不得退回固定 JS 模板；默认带 diff_check + validation.defaults.no_match
  - name: repository-upgrade
    role: 平台无关的版本迁移规划、确定性状态与事务应用
    entry: ["src/upgrade.ts", "src/commands/upgrade.ts"]
    owns: ["src/upgrade.ts", "src/commands/upgrade.ts", "src/harness-cli.ts"]
    tests: ["test/upgrade.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - 运行中的 CLI 版本就是目标版本；core 不能访问 registry、CI 或代码托管 API
      - apply 必须拒绝 dirty 仓库，并把 manifest、生成入口和 lock 放入同一次 managed-file 事务
      - 只解析而没有迁移时必须保留 manifest 原始字节，不能顺手格式化
      - upgrade 在同一事务里原位刷新已由 Harness 管理的项目级 hook（runner + 已配置客户端的配置，保留第三方条目）；不新装、不卸载；linked Codex 用户分发器横跨用户目录和 Git admin，只给出带 --allow-user-dispatcher 的精确命令
      - upgrade 只刷新已有入口，不创建首个 AGENTS.md（那是接入盲审的终点）
      - lock 版本会进入 Agent 复制执行的命令，只接受纯 semver，其余一律回退 @latest
  - name: context-freshness
    role: 任意 repo 文档登记、authority 语义与 Agent review evidence
    entry: ["src/state.ts"]
    owns: ["src/state.ts", "src/commands/record-context-review.ts"]
    tests: ["test/state.test.ts", "test/context-review.test.ts", "test/doctor.test.ts", "test/verify.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
    pitfalls:
      - root=repo 表示 path 从仓库根解析，不代表固定目录名，也不搬运业务文档
      - authority=derived/policy/review 都要求显式 Agent 复核；hash 只能证明之后没变，不能证明分析质量
      - 删除 binds、切换 authority 或绑定源缺失都必须让旧 review 失效，不能靠旧 hash 继续显示 current
      - inheritedContextKeys 拿不准就保持 task-scoped：base 没有 manifest、读 base 失败、声明或复核记录有任何差异都不算继承
      - record-context-review 接受仓库相对写法并可重复多选；全部解析成功才一次写入，失败时列出可复核的条目
  - name: core-gates
    role: init/sync/doctor/verify/contract/enforcement 的通用基础
    entry: ["src/commands/verify.ts"]
    owns:
      - "src/commands/{accept,doctor,verify}.ts"
      - "src/{contracts,util,guidance}.ts"
    tests: ["test/contracts.test.ts", "test/state.test.ts", "test/examples.test.ts", "test/guidance.test.ts", "test/doctor.test.ts", "test/verify.test.ts"]
    checks: ["test", "typecheck"]
    pitfalls:
      - verify --json 对 repo-controlled matcher/文件系统异常也必须只输出一份结构化失败报告
      - accept-contract 必须先校验 manifest，基线只能写 .agents/contracts 的安全普通文件
      - doctor 的影响面 glob 检查用 planner 同款 picomatch（含点目录）逐个求值，owns 与 tests 的单个 glob 零命中都要报
      - verify 给 invariant / contract 的 check 注入任务 diff（snapshot 不注入）；verify / doctor 报 ERR 时 nextActions 必须有 required 项，不能显示 nothing required；说明性信息要放在 NEXT ACTIONS 之前
  - name: bundled-skills
    role: onboard / check-loop 技能的定位、输出与维护
    entry: ["src/skill.ts"]
    owns: ["src/skill.ts", "src/commands/{onboard,check-loop}.ts", "skills/**"]
    tests: ["test/onboard.test.ts"]
    checks: ["test", "typecheck"]
    pitfalls:
      - onboard 打印的命令钉住打印它的那个版本，init 写入 lock 后一律按 lock 调用；不要在 Skill 里写“始终用 @latest”
  - name: examples
    role: 五种接入形态的可读、doctor-healthy 回归样板（含 Electron validation gates），以及 GitHub Actions / GitLab CI 门禁示例（examples/ci）
    entry: ["test/examples.test.ts"]
    owns: ["examples/**"]
    tests: ["test/examples.test.ts"]
    checks: ["test", "typecheck"]
    test_touch: required
  - name: repository-assets
    role: 包元数据、生成状态、项目文档与本仓维护配置
    entry: ["package.json"]
    owns:
      - ".agents/**"
      - ".codex/**"
      - ".github/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - ".gitignore"
      - "package.json"
      - "pnpm-lock.yaml"
    tests: ["test/**"]
    checks: ["test", "typecheck"]
    pitfalls:
      - package 声明 Node >=18，runtime 依赖不得偷偷抬高版本下限；发布包要用真实 Node 18 跑 CLI smoke

validation:
  policies:
    test_touch_default: advisory
  required_coverage: ["src/**"]
  defaults:
    no_match: ["typecheck"]

playbooks:
  dir: playbooks/
